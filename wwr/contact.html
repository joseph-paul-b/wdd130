<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Contact White Water Rafting for reservations, questions, trip information, and customer support.">
    <meta name="author" content="Joseph Paul">
    <title>Contact Us | White Water Rafting</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/logo.png" alt="White Water Rafting Logo">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>

        <h1>Contact Us</h1>

        <section class="company-info">

            <h2>Company Information</h2>

            <p><strong>Address:</strong> 123 River Road, Colorado, USA</p>

            <p><strong>Phone:</strong> +1 (555) 123-4567</p>

            <p><strong>Email:</strong> info@whitewaterrafting.com</p>

            <iframe
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3066.9755080574423!2d-105.6488679!3d39.7626583!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x876bb1a6cb0bac7b%3A0x28f36e03006c17ea!2sColorado%20Rafting%20Company%20-%20Clear%20Creek%20Boathouse!5e0!3m2!1sen!2sng!4v1785713545313!5m2!1sen!2sng"
              width="600" height="300" allowfullscreen loading="lazy"
              referrerpolicy="strict-origin-when-cross-origin">
            </iframe>

        </section>

        <section class="employees">

            <h2>Meet Our Team</h2>

            <div class="employee-gallery">

                <figure>
                    <img src="images/employee1.jpg" alt="Sarah Johnson, River Guide">
                    <figcaption>Sarah Johnson - River Guide</figcaption>
                </figure>

                <figure>
                    <img src="images/employee2.jpg" alt="David Brown - Operations Manager">
                    <figcaption>David Brown - Operations Manager</figcaption>
                </figure>

                <figure>
                    <img src="images/employee3.jpg"
                      alt="Emily Wilson - Customer Service Representative">
                    <figcaption>Emily Wilson - Customer Service Representative</figcaption>
                </figure>

            </div>

        </section>

        <section class="contact-form">

            <h2>Send Us a Message</h2>

            <form action="#" method="post">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>

                <fieldset>

                    <legend>Purpose of Message</legend>

                    <input type="radio" id="general" name="purpose" value="general" required>
                    <label for="general">General Inquiry</label>

                    <input type="radio" id="reservation" name="purpose" value="reservation">
                    <label for="reservation">Reservation Question</label>

                    <input type="radio" id="website" name="purpose" value="website">
                    <label for="website">Website Suggestion</label>

                </fieldset>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="6"
                  placeholder="Type your message here..." required>
                </textarea>

                <label>
                    <input type="checkbox" id="newsletter" name="newsletter">
                    Please subscribe me to the monthly newsletter
                </label>

                <button type="submit">Send Message</button>

            </form>

        </section>

    </main>

    <footer>

        <p>&copy; 2026 White Water Rafting | Joseph Paul</p>

        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.png" alt="Visit White Water Rafting on Facebook">
            </a>

            <a href="https://instagram.com">
                <img src="images/instagram.jpg" alt="Visit White Water Rafting on Instagram">
            </a>

            <a href="https://twitter.com">
                <img src="images/twitter.png" alt="Visit White Water Rafting on Twitter">
            </a>
        </nav>

    </footer>

</body>

</html>
